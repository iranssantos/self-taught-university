<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self-Taught University</title>
<meta name="theme-color" content="#1C2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Self-Taught University">
<meta name="description" content="Follow a self-directed university program: courses, terms, assignments, and a transcript, all on your device.">
<script>try{var t=localStorage.getItem("stu-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#1C2230; --muted:#5D6677; --line:#DCE0E7; --focus:#3F51B5;
  --st-planned:#616161; --st-active:#3F51B5; --st-done:#0B8043;
  --al-warn:#F6BF26; --al-soon:#FB8C00; --al-late:#D50000;
  --serif:Georgia, "Noto Serif", "Times New Roman", serif;
  --sans:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --r:10px; --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12151C; --surface:#1A1F29; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2A3140; --focus:#8C9EFF;
    --st-planned:#8A8F98; --st-active:#7986CB; --st-done:#33A36B;
  }
}
:root[data-theme="dark"]{
  --paper:#12151C; --surface:#1A1F29; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2A3140; --focus:#8C9EFF;
  --st-planned:#8A8F98; --st-active:#7986CB; --st-done:#33A36B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.35rem} h2{font-size:1.5rem;margin-bottom:.75rem} h3{font-size:1.1rem}
p{margin:.4rem 0}
a{color:var(--focus)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.small{font-size:.875rem} .muted{color:var(--muted)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .in{max-width:980px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.save{font-size:.8rem;color:var(--muted);white-space:nowrap;background:none;border:0;padding:.4rem;min-width:32px;min-height:32px;cursor:pointer}
.save .dirty{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--al-soon)}
.save b{color:var(--st-done);font-weight:700}
main{max-width:980px;margin:0 auto;padding:1rem 1rem calc(var(--nav-h) + 2rem + env(safe-area-inset-bottom,0px))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;padding:.55rem .1rem;min-height:var(--nav-h);font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.bottom button[aria-current="page"] svg{color:var(--st-active)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .85rem;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.danger{color:var(--al-late);border-color:color-mix(in srgb,var(--al-late) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:32px;padding:.25rem .6rem;font-size:.85rem}
label.f{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.5rem .6rem;color:var(--ink);font-size:1rem;min-height:40px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem}
/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:.75rem 0 .25rem}
.tile{aspect-ratio:1;min-width:0;overflow:hidden;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 .85rem/1 var(--sans);color:#fff;border:0;cursor:pointer;position:relative}
.tile[data-st="planned"]{background:transparent;color:var(--st-planned);box-shadow:inset 0 0 0 2px var(--st-planned)}
.tile[data-st="active"]{background:var(--st-active)}
.tile[data-st="done"]{background:var(--st-done)}
.tile[data-al]::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
.tile[data-al="warn"]::after{background:var(--al-warn)} .tile[data-al="soon"]::after{background:var(--al-soon)} .tile[data-al="late"]::after{background:var(--al-late)}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
/* status & alert chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;padding:.12rem .5rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.planned{color:var(--st-planned)} .chip.active{color:var(--st-active)} .chip.done{color:var(--st-done)}
.alert{display:flex;gap:.5rem;align-items:flex-start;font-size:.88rem;padding:.35rem 0}
.alert .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:.4rem}
.dot.warn{background:var(--al-warn)} .dot.soon{background:var(--al-soon)} .dot.late{background:var(--al-late)} .dot.ok{background:var(--st-done)}
.alert .lv{font-weight:700;min-width:5.5rem}
/* course card */
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--st-planned);border-radius:8px;padding:.6rem .7rem;margin-bottom:.5rem}
.card .ct{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.lrow{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.lp{font-size:.75rem;line-height:1.2;padding:.25rem .45rem;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:30px;color:var(--ink)}
.lp[data-s="ok"]{background:var(--st-done);border-color:var(--st-done);color:#fff}
.lp[data-s="soon"]{border:2px solid var(--al-soon)}
.lp[data-s="late"]{border:2px solid var(--al-late);color:var(--al-late);font-weight:700}
.lp[data-s="none"]{color:var(--muted);border-style:dashed}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:.25rem 0 1rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.guide h3{margin:1.1rem 0 .3rem}
.guide p,.guide li{max-width:68ch}
.guide ul{padding-left:1.2rem;margin:.3rem 0}
.card[data-st="active"]{border-left-color:var(--st-active)} .card[data-st="done"]{border-left-color:var(--st-done)}
.card[data-al="warn"]{box-shadow:0 0 0 2px var(--al-warn)} .card[data-al="soon"]{box-shadow:0 0 0 2px var(--al-soon)} .card[data-al="late"]{box-shadow:0 0 0 2px var(--al-late)}
.card .n{font:600 .74rem/1 var(--sans);letter-spacing:.03em;color:var(--muted);margin-right:.45rem;white-space:nowrap}
.tile small{position:absolute;top:3px;left:4px;font-size:.55rem;font-weight:600;opacity:.75}
.card .meta{font-size:.8rem;color:var(--muted);margin-top:.15rem}
.sem{border-top:1px solid var(--line);padding:.8rem 0}
.sem:first-child{border-top:0;padding-top:0}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.75rem;color:var(--muted);text-align:center;padding:.2rem 0}
.cal button{min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.25rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:.8rem}
.cal button.out{opacity:.35}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal button.sel{background:color-mix(in srgb,var(--st-active) 12%,var(--surface))}
.cal .dots{display:flex;flex-wrap:wrap;gap:3px}
.cal .dots span{width:8px;height:8px;border-radius:50%}
.cal .dots span.note{width:12px;height:3px;border-radius:2px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.4rem .8rem;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.item{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:.5rem 0}
.item:first-child{border-top:0}
.item .acts{display:flex;gap:.3rem;flex:0 0 auto}
/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(680px,96vw);max-height:90vh;background:var(--surface);color:var(--ink)}
#ask,#askl{width:min(420px,92vw)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog .dh{position:sticky;top:0;background:var(--surface);padding:1rem 1rem .6rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;z-index:1}
dialog .db{padding:1rem}
details summary{cursor:pointer;font-weight:600;padding:.3rem 0}
.prq{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.2rem .8rem;max-height:260px;overflow:auto;padding:.4rem 0}
.prq label{font-size:.88rem;display:flex;gap:.4rem;align-items:center}
.list-row{display:grid;grid-template-columns:1fr;gap:.4rem;border:1px solid var(--line);border-radius:8px;padding:.6rem;margin-bottom:.5rem}
.list-row[data-ok="1"]{border-color:color-mix(in srgb,var(--st-done) 60%,var(--line))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;z-index:20;max-width:90vw}
.empty{color:var(--muted);font-size:.9rem;padding:.5rem 0}
.big{font:700 2rem/1 var(--serif)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.stats div{border-left:3px solid var(--line);padding-left:.6rem}
@media (max-width:640px){
  nav.bottom button{font-size:.7rem}
  h2{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.prog{font-size:.85rem;color:var(--muted);margin-top:.1rem}
.prog select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.15rem .4rem;font-size:.85rem;max-width:60vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.sec{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.5rem}
.sec.panel{border-top:1px solid var(--line);padding:0 1rem;margin:0 0 .8rem}
.sec summary{font-family:var(--serif);font-weight:600;font-size:1.05rem;padding:.55rem 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"▾";color:var(--muted);font-family:var(--sans)}
.sec[open] summary::after{content:"▴"}
.sec.panel[open]{padding-bottom:1rem}
.secb{padding:.2rem 0}
.line{padding:.35rem 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.lnk{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-size:.92rem}
.lnk .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%}
.hin{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.5rem .6rem;min-height:40px;max-width:9rem;color:var(--ink);font-size:1rem}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:.4rem}
.bar span{display:block;height:100%;background:var(--st-done)}
.wchart{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:110px;margin-top:.8rem;align-items:end}
.wcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.wcol span{width:70%;background:var(--st-active);border-radius:3px 3px 0 0;min-height:2px}
.wcol small{font-size:.65rem;color:var(--muted);height:1.1rem;line-height:1.1rem}
.wneed{position:absolute;left:0;right:0;border-top:2px dashed var(--al-soon)}
.ktag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 .4rem;margin-left:.3rem;vertical-align:1px;white-space:nowrap}
.xinfo{margin-top:.5rem}
.refrow{border-bottom:1px solid var(--line);padding:.5rem 0}
.card .ct{font-size:.95rem}
#save{font-size:1rem}
h4{font-family:var(--serif);font-weight:600;font-size:1rem;margin:0}
.xrefs{margin-top:.5rem;display:grid;gap:.3rem}
.xref{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)}
.cite{font-size:.9rem;margin:.3rem 0 .5rem;line-height:1.45}
.semctl{margin:.4rem 0 .6rem;align-items:flex-end}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
details.more{margin-top:.5rem}details.more>summary{cursor:pointer;font-size:.85rem;color:var(--muted);list-style:none}details.more>summary::-webkit-details-marker{display:none}details.more>summary::before{content:"▸ ";}details.more[open]>summary::before{content:"▾ ";}details.more[open]>summary{margin-bottom:.4rem}
</style>
</head>
<body>
<header class="top"><div class="in"><div><h1>Self-Taught University</h1><div id="prog" class="prog"></div></div><div class="row" style="flex-wrap:nowrap"><button class="save" id="save" data-act="backup" aria-live="polite"></button><button class="btn sm" data-act="guide">Guide</button></div></div></header>
<main id="view" tabindex="-1"></main>
<nav class="bottom" aria-label="Sections"><div class="in" id="nav"></div></nav>
<dialog id="dlg"></dialog>
<dialog id="askl" aria-labelledby="asklT"><div class="db"><p id="asklT" style="margin:0 0 .6rem;font-weight:600"></p><p id="asklH" class="small muted" hidden style="margin:.3rem 0 .5rem"></p><input id="asklIn" class="hin" type="url" placeholder="https://" style="max-width:100%;width:100%"><div class="row" style="justify-content:flex-end;margin-top:.8rem"><button class="btn" data-askl="">Cancel</button><button class="btn primary" data-askl="ok">Save</button></div></div></dialog>
<dialog id="ask" aria-labelledby="askMsg"><div class="db"><p id="askMsg" style="margin:0 0 1rem"></p><div class="row" style="justify-content:flex-end"><button class="btn" data-ask="0">Cancel</button><button class="btn primary" id="askOk" data-ask="1">OK</button></div></div></dialog>
<input type="file" id="fileIn" accept="application/pdf" hidden>
<input type="file" id="courseIn" accept=".json,.csv,application/json,text/csv" hidden>
<input type="file" id="restoreIn" accept=".zip,.json,application/zip,application/json" hidden>

<script>
"use strict";
/* ---------- Constants ---------- */
const STATUS = { planned:{label:"Planned"}, active:{label:"In progress"}, done:{label:"Completed"} };
const ST_ORDER = ["planned","active","done"];
const LV = {late:{label:"Overdue",rank:3}, soon:{label:"Due soon",rank:2}, warn:{label:"Needs attention",rank:1}};
const LIST_DEF = [
  {key:"b1", label:"Problem Set 1", q:25, week:4},
  {key:"b2", label:"Problem Set 2", q:25, week:8},
  {key:"b3", label:"Problem Set 3", q:25, week:12},
  {key:"b4", label:"Problem Set 4", q:25, week:15},
  {key:"rev",label:"Cumulative Review", q:10, week:16}
];
const ORIGINS = ["Own","AI (checked)","Adapted from a book"];
const ROLE = {principal:"Primary", complementar:"Supplementary"};

const KIND = {obrig:"Fixed", sem:"Seminar", elet:"Elective", opt:"Free elective"};
const KIND_PL = {obrig:"Fixed courses", sem:"Seminars", elet:"Electives", opt:"Free electives"};
/* a course taken as a seminar still counts in its own block (elective or free elective).
   Any course outside the fixed ones can count as a free elective; only electives can count as electives. */
const canElet = c => (c.roles||[c.kind]).includes("elet");
const canSem  = c => (c.roles||[]).includes("sem");
const bucket = c => c.kind==="sem" ? (c.base||"elet") : c.kind;
const DEFAULT_HOURS=170;
/* minimum structure of every program: the standard of an MIT undergraduate degree (Course 18) */
const STANDARD={hours:170, core:17, electives:11, courses:32, seminars:2};
function structureProblems(st){
  const cs=Object.values(st.courses||{}); const p=[];
  const core=cs.filter(c=>c.kind==="obrig").length;
  const canElet=cs.filter(c=>c.kind!=="obrig" && (c.kind==="elet"||(c.roles||[]).includes("elet")||(c.kind==="sem"&&(c.base||"elet")==="elet"))).length;
  const semCap=cs.filter(c=>c.kind==="sem"||(c.roles||[]).includes("sem")).length;
  const set=st.settings||{};
  if(core<STANDARD.core) p.push(`It has ${core} fixed courses; at least ${STANDARD.core} are needed.`);
  if(canElet<STANDARD.electives) p.push(`Its catalog has ${canElet} electives; at least ${STANDARD.electives} are needed.`);
  if(cs.length-core<STANDARD.courses-STANDARD.core) p.push(`Its catalog has ${cs.length-core} courses beyond the fixed ones; at least ${STANDARD.courses-STANDARD.core} are needed.`);
  if(semCap<STANDARD.seminars) p.push(`It has ${semCap} courses that can be taken as a seminar; at least ${STANDARD.seminars} are needed.`);
  if(num(set.minTotal,0)<STANDARD.courses) p.push(`It requires ${num(set.minTotal,0)} courses to complete; at least ${STANDARD.courses} are needed.`);
  if(num(set.minElet,0)<STANDARD.electives) p.push(`It requires ${num(set.minElet,0)} electives; at least ${STANDARD.electives} are needed.`);
  if(num(set.minSem,0)<STANDARD.seminars) p.push(`It requires ${num(set.minSem,0)} seminars; at least ${STANDARD.seminars} are needed.`);
  const low=cs.filter(c=>num(c.hours,0)<STANDARD.hours); if(low.length) p.push(`${low.length} course(s) carry fewer than ${STANDARD.hours} hours (${low.slice(0,4).map(c=>c.code||c.name).join(", ")}${low.length>4?"…":""}).`);
  const bad=cs.filter(c=>!String(c.code||"").trim()||!String(c.name||"").trim()); if(bad.length) p.push(`${bad.length} course(s) have no code or no name.`);
  const nobook=cs.filter(c=>c.kind!=="sem" && !(c.roles||[]).includes("sem") && !(c.refs||[]).some(r=>r.role==="principal")); if(nobook.length) p.push(`${nobook.length} course(s) have no primary textbook (${nobook.slice(0,4).map(c=>c.code||c.name).join(", ")}${nobook.length>4?"…":""}).`);
  return p;
}

/* ---------- Utilities ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now().toString(36)+Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysUntil = s => Math.round((parse(s)-parse(today()))/864e5);
const fmt = s => s ? parse(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "no date";
const fmtShort = s => s ? parse(s).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "";
const dm = x => { const [,m,d]=x.split("-"); return `${+m}/${+d}`; };
const nextMonday = () => { const d=new Date(); const k=(8-d.getDay())%7||7; d.setDate(d.getDate()+k); return iso(d); };
const weekStart = s => { const d=parse(s); d.setDate(d.getDate()-d.getDay()); return iso(d); };
const num = (v,def) => { const n=Number(v); return Number.isFinite(n) ? n : def; };

/* ---------- IndexedDB ---------- */
let DB;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("stu-app",1);
    r.onupgradeneeded=()=>{ const db=r.result;
      db.createObjectStore("kv"); db.createObjectStore("events",{keyPath:"n",autoIncrement:true}); db.createObjectStore("files",{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=DB.transaction(store,mode); const s=t.objectStore(store); let out;
    Promise.resolve(fn(s)).then(v=>{out=v;});
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
const reqP = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbGet = (store,key) => tx(store,"readonly",s=>reqP(s.get(key)));
const dbPut = (store,val,key) => tx(store,"readwrite",s=>{ key===undefined ? s.put(val) : s.put(val,key); });
const dbAll = store => tx(store,"readonly",s=>reqP(s.getAll()));
const dbClear = store => tx(store,"readwrite",s=>{ s.clear(); });
const dbDel = (store,key) => tx(store,"readwrite",s=>{ s.delete(key); });

const SEM_DEF=[{key:"video",label:"Presentation video",week:14},{key:"artigo",label:"Paper (about 10 pages)",week:16}];
function listsFor(kind){
  if(kind==="sem") return SEM_DEF.map(l=>({key:l.key,label:l.label,questions:0,origin:"",link:"",deliveredAt:""}));
  return LIST_DEF.map(l=>({key:l.key,label:l.label,questions:l.q,origin:ORIGINS[0],link:"",deliveredAt:""}));
}

/* ---------- Program calendar (always computed) ---------- */
const addMonths=(s,n)=>{ const d=parse(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const satOnOrBefore=s=>{ const d=parse(s); d.setDate(d.getDate()-((d.getDay()+1)%7)); return iso(d); };
function courseWindow(st,c,semStart){
  /* planned: starts at the start of its term or today, whichever is later */
  const start=(c.status!=="planned" && c.startedAt) ? c.startedAt : (semStart && semStart<today() ? today() : semStart); if(!start) return null;
  const nomEnd=addDays(addMonths(start,st.settings.semMonths||4),-1);
  return {start, nomEnd, end: c.status==="done" && c.doneAt ? c.doneAt : nomEnd};
}
function duesFor(w,c){
  if(!w) return {}; const days=daysBetween(w.start,w.nomEnd)+1; const o={};
  for(const l of (c?.lists||LIST_DEF)){ const wk=[...LIST_DEF,...SEM_DEF].find(d=>d.key===l.key)?.week||16;
    let due=satOnOrBefore(addDays(w.start, Math.round(days*wk/16)-1)); if(due<w.start) due=w.start; o[l.key]=due; }
  return o;
}
/* Each term starts when the previous one ends; a term ends when its courses end. */
function computeSchedule(st){
  const per=st.settings.perYear||3, months=st.settings.semMonths||4; const sems=[], course={}; let cursor=st.settings.courseStart;
  const byS={}; for(const c of Object.values(st.courses)) if(c.semesterId) (byS[c.semesterId]=byS[c.semesterId]||[]).push(c);
  (st.sems||[]).forEach((x,i)=>{
    let start=cursor; let end=addDays(addMonths(start,months),-1); const list=byS[x.id]||[];
    if(list.length){ end="";
      for(const c of list){ const w=courseWindow(st,c,cursor); course[c.id]={...w,dues:duesFor(w,c)}; if(!end||w.end>end) end=w.end; if(w.start<start) start=w.start; } }
    sems.push({id:x.id, idx:i, num:i+1, year:Math.floor(i/per)+1, k:i%per+1, start, end, name:`Term ${i+1}`});
    cursor=addDays(end,1);
  });
  for(const c of Object.values(st.courses)) if(!course[c.id]){
    const w=c.status!=="planned"&&c.startedAt?courseWindow(st,c,null):null;
    course[c.id]=w?{...w,dues:duesFor(w,c)}:{start:"",end:"",dues:{}};
  }
  return {sems, course};
}
let _SCH=null, _SCHS=null;
function sched(){ if(_SCHS!==S){ _SCH=computeSchedule(S); _SCHS=S; } return _SCH; }
const dueOf=(c,l)=>sched().course[c.id]?.dues[l.key]||"";

function planOrder(list){
  const ids=new Set(list.map(c=>c.id)); const order=[]; const placed=new Set(); const rest=[...list];
  /* courses that other planned courses depend on go first (longest chain first), so no term is wasted at the end */
  const depth={}; const dep=id=>{ if(depth[id]!==undefined) return depth[id]; depth[id]=0;
    let d=0; for(const c of list) if(c.prereq.includes(id)) d=Math.max(d,1+dep(c.id)); return depth[id]=d; };
  for(const c of list) dep(c.id);
  while(rest.length){
    rest.sort((a,b)=>(depth[b.id]-depth[a.id])||(a.num-b.num));
    let i=rest.findIndex(c=>c.prereq.every(p=>!ids.has(p)||placed.has(p)));
    if(i<0) i=0;
    const c=rest.splice(i,1)[0]; order.push(c); placed.add(c.id);
  }
  return order;
}
/* places courses in terms, never in the same term as (or before) a prerequisite */
function pack(st, toPlace, start){
  const per=Math.max(1,st.settings.perSemester); const sems=[...(st.sems||[])]; const cs=Object.values(st.courses);
  const moving=new Set(toPlace.map(c=>c.id)); const idx={}; const count={};
  sems.forEach((x,i)=>{ idx[x.id]=i; });
  /* after the first year, each term keeps one slot for a course the student chooses, as electives start in the second year at MIT */
  const firstYear=Math.max(1,num(st.settings.perYear,3)); const fixedCap=i=> i<firstYear ? per : Math.max(1,per-1); const countFix={};
  const pos={}; for(const c of cs) if(!moving.has(c.id)){ if(c.status==="done") pos[c.id]=-1; else if(c.semesterId && idx[c.semesterId]!==undefined){ pos[c.id]=idx[c.semesterId]; count[c.semesterId]=(count[c.semesterId]||0)+1; if(c.kind==="obrig") countFix[c.semesterId]=(countFix[c.semesterId]||0)+1; } }
  const rest=planOrder(toPlace); const assign={}, add=[]; let i=Math.max(0,start);
  const ok=(c,i)=>c.prereq.every(p=>!st.courses[p] || (pos[p]!==undefined && pos[p]<i) || (!moving.has(p) && pos[p]===undefined));
  let guard=0;
  while(rest.length && guard<1000){ guard++;
    if(i>=sems.length){ const ns={id:uid()}; sems.push(ns); add.push(ns); idx[ns.id]=i; }
    const sid=sems[i].id; let free=per-(count[sid]||0); let placedHere=0;
    for(let k=0;k<rest.length && free>0;){
      if(ok(rest[k],i) && (rest[k].kind!=="obrig" || (countFix[sid]||0)<fixedCap(i))){ const c=rest.splice(k,1)[0]; assign[c.id]=sid; pos[c.id]=i; count[sid]=(count[sid]||0)+1; if(c.kind==="obrig") countFix[sid]=(countFix[sid]||0)+1; free--; placedHere++; } else k++;
    }
    if(!placedHere && free===per-(count[sid]||0) && rest.length && sems.slice(i+1).length===0 && add.length>rest.length+sems.length){ const c=rest.shift(); assign[c.id]=sid; pos[c.id]=i; }
    i++;
  }
  return {assign, add, sems};
}
/* places courses without a term in open slots, adding terms at the end if needed */
function fillPlan(st){
  const list=Object.values(st.courses).filter(c=>c.chosen!==false && !c.semesterId && c.status!=="done");
  const {assign,add}=pack(st, list, 0); return {assign, add};
}
/* rearranges planned courses in catalog order, keeping the standard per term */
function reflow(st){
  const cs=Object.values(st.courses); const sems=st.sems||[];
  let start=sems.findIndex(x=>cs.some(c=>c.semesterId===x.id && c.status!=="done"));
  if(start<0) start=sems.findIndex(x=>!cs.some(c=>c.semesterId===x.id)); if(start<0) start=sems.length;
  const {assign,add,sems:all}=pack(st, cs.filter(c=>c.status==="planned" && c.chosen!==false), start);
  const used=new Set([...cs.filter(c=>c.status!=="planned"&&c.semesterId).map(c=>c.semesterId), ...Object.values(assign)]);
  const remove=[]; for(let k=all.length-1;k>=0 && !used.has(all[k].id);k--) remove.push(all[k].id);
  return {assign, add, remove};
}
const DEFAULT_META={title:"Untitled program", description:"", author:"", version:"1", basedOn:""};
/* fills in missing fields (for example, in hand-made program files) */
function normalize(st){
  st.settings=Object.assign({perSemester:2, semMonths:4, perYear:3, minTotal:0, minSem:0, minElet:0}, st.settings||{});
  if(!st.settings.courseStart) st.settings.courseStart=nextMonday();
  st.punches=st.punches||{}; st.agenda=st.agenda||{}; st.books=st.books||{}; st.sems=st.sems||[]; st.meta=st.meta||{...DEFAULT_META};
  for(const c of Object.values(st.courses||{})){
    c.kind=c.kind||"obrig"; c.roles=c.roles||[c.kind]; if(c.chosen===undefined) c.chosen=true;
    c.refs=c.refs||[]; c.prereq=c.prereq||[]; c.lists=c.lists||listsFor(c.kind); c.startedAt=c.startedAt||""; c.doneAt=c.doneAt||"";
  }
  return st;
}

function apply(state, ev){
  const s=structuredClone(state); const p=ev.payload; const t=p.today||iso(new Date(ev.ts));
  switch(ev.type){
    case "settings.set": Object.assign(s.settings, p.patch); break;
    case "course.add": s.courses[p.course.id]=p.course; break;
    case "course.update": { const c=s.courses[p.id]; if(!c) break; const prev=c.status; Object.assign(c,p.patch);
      if(p.patch.status && p.patch.status!==prev){
        if(p.patch.status==="planned"){ c.startedAt=""; c.doneAt=""; }
        if(p.patch.status==="active"){ if(!c.startedAt||prev==="planned") c.startedAt=t; c.doneAt="";
          /* starting a course from a future term brings it to the current term */
          if(prev==="planned" && p.patch.semesterId===undefined){
            const sc=computeSchedule(state); const cs=Object.values(state.courses);
            const cur=sc.sems.find(x=>x.start<=t && t<=x.end) || sc.sems.find(x=>cs.some(k=>k.semesterId===x.id && k.status!=="done"));
            const mine=sc.sems.find(x=>x.id===c.semesterId);
            if(cur && (!mine || mine.idx>cur.idx)) c.semesterId=cur.id;
          } }
        if(p.patch.status==="done"){ if(!c.startedAt) c.startedAt=t; c.doneAt=t; }
      }
      break; }
    case "course.remove":
      delete s.courses[p.id];
      for(const c of Object.values(s.courses)) c.prereq=c.prereq.filter(x=>x!==p.id);
      Object.values(s.courses).sort((a,b)=>a.num-b.num).forEach((c,i)=>{ c.num=i+1; });
      break;
    case "course.renumber": {
      const c=s.courses[p.id]; if(!c) break;
      const rest=Object.values(s.courses).filter(x=>x.id!==p.id).sort((a,b)=>a.num-b.num);
      const pos=Math.max(1,Math.min(Math.round(p.to)||1, rest.length+1));
      rest.splice(pos-1,0,c); rest.forEach((x,i)=>{ x.num=i+1; });
      break; }
    case "sem.insert": s.sems.splice(Math.max(0,Math.min(p.at,s.sems.length)),0,p.sem); break;
    case "sem.remove":
      s.sems=s.sems.filter(x=>x.id!==p.id);
      for(const c of Object.values(s.courses)) if(c.semesterId===p.id) c.semesterId=null;
      break;
    case "plan.fill":
      for(const ns of p.add) s.sems.push(ns);
      for(const [cid,sid] of Object.entries(p.assign)) if(s.courses[cid]) s.courses[cid].semesterId=sid;
      for(const id of p.remove||[]) if(!Object.values(s.courses).some(c=>c.semesterId===id)) s.sems=s.sems.filter(x=>x.id!==id);
      break;
    case "list.update": { const c=s.courses[p.courseId]; const l=c?.lists.find(x=>x.key===p.key); if(l) Object.assign(l,p.patch); break; }
    case "punch.set":
      if(p.patch===null) delete s.punches[p.date]; else s.punches[p.date]=Object.assign({},s.punches[p.date]||{},p.patch);
      break;
    case "meta.update": s.meta=Object.assign({},s.meta,p.patch); break;
    case "agenda.add": s.agenda[p.item.id]=p.item; break;
    case "agenda.update": if(s.agenda[p.id]) Object.assign(s.agenda[p.id],p.patch); break;
    case "agenda.remove": delete s.agenda[p.id]; break;
    case "book.add": s.books[p.book.id]=p.book; break;
    case "book.update": if(s.books[p.id]) Object.assign(s.books[p.id],p.patch); break;
  }
  return s;
}

let S, G={profile:{}}, PROGS=null, DEVICE, pending=0;
const stateKey=id=>"state:"+id;
function applyG(g,ev){
  const s=structuredClone(g); const p=ev.payload;

const APP_VERSION="1.0";
async function dispatch(type,payload,opt={}){
  const ev={id:uid(), device:DEVICE, ts:Date.now(), seq:null, program:PROGS?.active||"", type, payload};
  const glob=type.startsWith("profile."); if(glob) G=applyG(G,ev); else S=apply(S,ev);
  pending++; renderSave();
  try{
    await dbPut("events",ev);
    if(glob) await dbPut("kv",G,"global");
    else { await dbPut("kv",S,stateKey(S.id));
      if(PROGS && PROGS.list[S.id] && PROGS.list[S.id].title!==S.meta.title){ PROGS.list[S.id].title=S.meta.title; await dbPut("kv",PROGS,"programs"); } }
  }catch(e){ toast("Could not save on this device: "+e.message); }
  pending--; if(!G.dirty){ G.dirty=true; try{ await dbPut("kv",G,"global"); }catch(e){} } renderSave();
  if(opt.quiet){ renderProg(); calSummary(); } else render();
}
/* top indicator: ✓ when the configuration file is up to date; an orange dot when there are changes not yet saved to it */
function renderSave(){ const el=$("#save"); if(!el) return;

  if(G?.dirty){ el.innerHTML='<span class="dirty"></span>'; el.title=el.ariaLabel="Changes not saved to your configuration file. Tap to save it."; }
  else { el.innerHTML="<b>✓</b>"; el.title=el.ariaLabel=G?.lastExport?"Configuration file up to date":"No changes to save"; } }

const FORMAT="stu-course";
function exportData(st){

    .map(b=>{ const id="b"+(++k); bookIds[b.id]=id; return {id, authors:b.authors||"", title:b.title||"", edition:b.edition||"", publisher:b.publisher||"", year:b.year||"", url:b.url||""}; });
  const cs=Object.values(st.courses).sort((a,b)=>a.num-b.num);
  return {format:FORMAT, version:1,
    course:{title:st.meta.title, description:st.meta.description||"", author:st.meta.author||"", version:st.meta.version||"1", basedOn:st.meta.basedOn||"", language:"en"},
    settings:{monthsPerPeriod:st.settings.semMonths, periodsPerYear:st.settings.perYear, coursesPerPeriod:st.settings.perSemester, minCourses:st.settings.minTotal||0, minElectives:st.settings.minElet||0, minSeminars:st.settings.minSem||0},
    books,
    courses:cs.map(c=>({number:c.num, code:c.code||"", name:c.name, kind:c.kind||"obrig", roles:c.roles||[c.kind||"obrig"], hours:c.hours, prerequisites:c.prereq.map(id=>st.courses[id]?.num).filter(Boolean),
      books:c.refs.filter(r=>bookIds[r.bookId]).map(r=>({book:bookIds[r.bookId], role:r.role==="principal"?"main":"supplementary", chapters:r.chapters||""})),
      reference:{name:c.refLabel||"", url:c.refUrl||""}, ...(c.minDone?{minCompleted:c.minDone}:{})}))};
}
function programFromData(o){
  if(!o || o.format!==FORMAT || !Array.isArray(o.courses)) throw new Error("The file is not in the app's program format.");
  const set=o.settings||{}, meta=o.course||{};
  const st={version:3, meta:{title:String(meta.title||"Untitled program"), description:meta.description||"", author:meta.author||"", version:String(meta.version||"1"), basedOn:meta.basedOn||"", handbookUrl:/^https?:\/\//.test(meta.handbook||"")?meta.handbook:""},
    settings:{perSemester:num(set.coursesPerPeriod,2), courseStart:nextMonday(), semMonths:num(set.monthsPerPeriod,4), perYear:num(set.periodsPerYear,3), minTotal:num(set.minCourses,STANDARD.courses), minSem:num(set.minSeminars,STANDARD.seminars), minElet:num(set.minElectives,STANDARD.electives)},
    courses:{}, books:{}, sems:[], punches:{}, agenda:{}};
  const bmap={};
  for(const b of o.books||[]){ const id="b-"+uid(); bmap[b.id]=id; st.books[id]={id, authors:b.authors||"", title:b.title||"Book", edition:b.edition||"", publisher:b.publisher||"", year:b.year||"", url:b.url||"", link:""}; }
  const list=[...o.courses].sort((a,b)=>num(a.number,0)-num(b.number,0)); const nmap={};
  list.forEach((c,i)=>{ const id="c-"+uid(); nmap[c.number]=id; const kind=KIND[c.kind]?c.kind:"obrig";
    st.courses[id]={id, num:i+1, code:String(c.code||""), kind, chosen:kind==="obrig", name:String(c.name||`Course ${i+1}`), hours:num(c.hours,DEFAULT_HOURS), prereq:[], semesterId:null, status:"planned", startedAt:"", doneAt:"", notes:"",
      refs:(c.books||[]).filter(r=>bmap[r.book]).map(r=>({bookId:bmap[r.book], role:/^(main|principal)$/i.test(r.role)?"principal":"complementar", chapters:r.chapters||""})),
      refLabel:c.reference?.name||"", refUrl:c.reference?.url||"", roles:Array.isArray(c.roles)&&c.roles.every(r=>KIND[r])?c.roles:[kind], lists:listsFor(kind), minDone:num(c.minCompleted,0)}; });
  for(const c of list){ const me=st.courses[nmap[c.number]]; me.prereq=(c.prerequisites||[]).map(n=>nmap[n]).filter(Boolean); }
  const {assign,add}=fillPlan(st); st.sems=add; for(const [cid,sid] of Object.entries(assign)) st.courses[cid].semesterId=sid;
  return st;
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,""); const first=text.split(/\r?\n/)[0]||""; const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===d){ row.push(f); f=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; } else f+=ch; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const CSV_COLS=["number","code","name","type","hours","prerequisites","main_book","main_chapters","supplementary_book","supplementary_chapters","reference_name","reference_url"];
function csvToData(text, title){
  const rows=parseCSV(text); if(rows.length<2) throw new Error("The CSV needs a header and at least one course.");

  const locked=c.lists.some(delivered), b=bucket(c), others=chosenArr().filter(x=>x.id!==c.id);
  const elN=others.filter(x=>bucket(x)==="elet").length, frN=others.filter(x=>bucket(x)==="opt").length, smN=others.filter(x=>x.kind==="sem").length;
  const minE=num(S.settings.minElet,0), minS=num(S.settings.minSem,0), minF=reqStatus().minF;
  const label = c.kind==="sem" ? `Seminar, counted as ${b==="elet"?"an elective":"a free elective"}` : b==="elet" ? "Elective" : "Free elective";
  const btns=[];
  if(!locked){
    if(b==="opt" && canElet(c) && elN<minE) btns.push(`<button class="btn sm" data-setkind="${c.id}|elet">Count as elective</button>`);
    if(b==="elet" && frN<minF) btns.push(`<button class="btn sm" data-setkind="${c.id}|opt">Count as free elective</button>`);
    if(c.kind!=="sem" && canSem(c) && smN<minS) btns.push(`<button class="btn sm" data-setkind="${c.id}|sem">Take as a seminar</button>`);
    if(c.kind==="sem") btns.push(`<button class="btn sm" data-setkind="${c.id}|${b}">Stop taking as a seminar</button>`);
  }
  return `<div class="row small" style="margin-top:.4rem"><span class="muted">${label}</span>${btns.join("")}</div>`;
}
/* catalog: one button for each way the course can be taken, while that group still has room */
function addAsHTML(c){
  const r=reqStatus(); const opts=[];
  if(canElet(c) && r.elCh<r.minE) opts.push(["elet","Elective"]);
  if(r.freeCh<r.minF) opts.push(["opt","Free elective"]);
  if(canSem(c) && r.semChosen<r.minS) opts.push(["sem","Seminar"]);
  if(!opts.length) opts.push([canElet(c)?"elet":"opt","Add"]);
  return `<div class="row" style="margin-top:.45rem;gap:.4rem">${opts.map(([k,t])=>`<button class="btn sm" data-addas="${c.id}|${k}">${t}</button>`).join("")}</div>`;
}

function viewHoje(){
  const t=today(); const p=S.punches[t]; const all=chosenArr(); const rs=reqStatus();

  const ws=weekStart(t); const wk=weekSum(ws);
  const sems=semsArr(); const cur=sems.find(x=>x.start<=t && t<=x.end) || sems.find(x=>inSem(x.id).some(c=>c.status!=="done"));
  const active=all.filter(c=>c.status==="active");

      :`<div class="row" style="flex-wrap:nowrap"><input id="punchH" class="hin" type="number" min="0" step="0.5" placeholder="Hours today" aria-label="Hours studied today"><button class="btn primary" data-act="punch">Log</button></div>`}
    ${ap.length?`<div style="margin-top:.6rem">${ap.map(it=>`<div class="line small">${it.kind==="appt"?`<b>${it.time?esc(it.time)+" ":""}${esc(it.title)}</b>`:esc(it.text)}</div>`).join("")}</div>`:""}

    ${curPlanned.map(c=>card(c,false,"",true)).join("")}

  </section>
  <section class="panel">
    <div class="spread"><h3>Progress</h3><span class="small muted">${rs.done} of ${rs.minT} · ${pct}%</span></div>

function calItems(){
  const m={}; const add=(d,x)=>{(m[d]=m[d]||[]).push(x);};
  for(const c of coursesArr()) for(const l of c.lists){ const due=delivered(l)?l.deliveredAt:dueOf(c,l); if(!due) continue; const d=daysUntil(due); add(due,{kind:"list",lv:delivered(l)?"ok":d<0?"late":d<=7?"soon":"active",c,l}); }
  for(const [d,p] of Object.entries(S.punches)) if(p.done) add(d,{kind:"punch",p});
  for(const sem of semsArr()){ add(sem.start,{kind:"semStart",sem}); add(sem.end,{kind:"semEnd",sem}); }
  for(const it of Object.values(S.agenda)) add(it.date,{kind:it.kind,it});
  return m;
}

/* ---------- Guide ---------- */
function openGuide(){
  const d=$("#dlg"); OPEN_COURSE=null;
  d.innerHTML=`<div class="dh"><h2 style="margin:0">Guide</h2><button class="btn sm" data-act="close">Close</button></div>
  <div class="db guide">
  <p>Self-Taught University helps you follow a complete undergraduate program on your own and keep the record that proves it. It provides no lessons, problems, or grades: you study from each course's books and reference course, put together your problem sets from those sources, solve and check them, and keep the files. The app plans your courses across terms, keeps a minimum protocol for every course, records your work and study hours, and builds your transcript. Everything stays on this device.</p>

  <h3>What you do, and what the app does</h3>
  ${YOUR_PART}

  <h3>Programs</h3>
  <p>A program is a file that describes a degree: its courses, books, prerequisites, and what it takes to complete it. Start one from the list on the first screen, or load your own from a file or a link. You can follow several programs and switch between them at the top of the screen or in Settings › Programs.</p>

  <h3>Minimum structure</h3>
  <p>Every program has the same minimum structure, and the app keeps it that way:</p>
  <ul>
    <li><b>${STANDARD.core} fixed courses</b>, set by the program's author. You do not choose them, and they cannot be removed.</li>
    <li><b>${STANDARD.electives} electives</b>, which you choose from the program's catalog of electives.</li>
    <li><b>Free electives</b> to reach ${STANDARD.courses} courses: any course in the catalog, counted as a free elective.</li>
    <li><b>${STANDARD.seminars} seminars</b>: courses that allow it can be taken as a seminar (presentation and paper) and still count as an elective or free elective.</li>
    <li>Every course carries at least ${STANDARD.hours} hours and has a code, a name, and a primary textbook (courses that can be seminars choose their texts by topic).</li>
  </ul>
  <p>Once a program has started, you can add courses, remove courses, and change their details, as long as these minimums still hold. A program file that does not meet them is not accepted, and the app lists what is missing.</p>

  <h3>The top bar</h3>
  <ul>
    <li><b>Self-Taught University</b>, and below it the program in use (a list, if you have more than one).</li>
    <li><b>✓ or orange dot</b>: ✓ means your configuration file is up to date; an orange dot means there are changes you have not saved to it. Tap it to save.</li>
    <li><b>Guide</b>: this page.</li>
  </ul>

  <h3>Today</h3>
  <ul>
    <li><b>Hours</b>: enter the hours you studied today and tap <b>Log</b>. Next to the date you see this week's total and the hours your courses in progress require.</li>
    <li><b>Current term</b>: the courses in progress, already open, with their assignments, books, and links; courses planned for this term have a <b>Start</b> button.</li>
    <li><b>Progress</b>: courses completed against those required, the fixed, elective, and seminar counts, a mosaic of all your courses (tap one to open it), and a chart of your weekly hours, with a dashed line for the hours required.</li>
  </ul>

  <h3>Courses</h3>
  <ul>
    <li>Your plan by year and term, with each term's dates. Tap a course to see its details; tap <b>Edit</b> to change them.</li>
    <li><b>Course catalog</b>, at the bottom: the courses you can add, with what you have planned so far. Each course shows the ways you can take it (<b>Elective</b>, <b>Free elective</b>, <b>Seminar</b>) while that group still has room; tap one to place the course in the next term with an open slot, after its prerequisites.</li>
    <li><b>Organize</b>: show only courses with a given status, create a course, <b>Rearrange</b> the planned courses, and add or delete a term by its number (the following terms are renumbered).</li>
  </ul>

  <h3>The parts of a course</h3>
  <ul>
    <li><b>Code and name</b>, for example MATH 101 Single Variable Calculus.</li>
    <li><b>Type</b>: fixed, elective, or free elective, and some courses can be taken as a seminar. You decide how a course counts when you add it from the catalog, and you can change it later by opening the course ("Count as elective", "Count as free elective", "Take as a seminar"). Each option disappears once its group is complete.</li>
    <li><b>Hours</b>: the nominal workload, at least ${STANDARD.hours}, shown in your transcript.</li>
    <li><b>Prerequisites</b>: courses to complete first. Starting a course early is allowed, but it is flagged.</li>
    <li><b>Books</b>: the primary and supplementary texts, with the chapters used. Under ⋯ you can add a link to your own copy of the book and edit its details, which then apply to every course that uses that book.</li>
    <li><b>Reference course</b>: a link to a university course (lectures, notes, problem sets) to guide your pace.</li>
    <li><b>Assignments</b>: four problem sets and a cumulative review, which you prepare from the course's books and reference course, solve, and check; in a course taken as a seminar, a recorded presentation and a paper. The app sets their due dates and records the links to your files.</li>
    <li><b>Status</b>: planned, in progress, or completed.</li>
  </ul>

  <h3>Assignments and completion</h3>
  <ul>
    <li>To submit an assignment, store your PDF wherever you keep your files, share it so that anyone with the link can open it, and paste that public link in the assignment. The app keeps only the link: it does not store, check, or publish the file. Tap a submitted assignment to open it; in the course's Edit window you can change or undo a submission.</li>
    <li>Due dates fall on Saturdays: problem sets at weeks 4, 8, 12, and 15 of the course and the review at week 16 (seminars: presentation at week 14, paper at week 16), counted from the day you tap <b>Start</b>.</li>
    <li>When every assignment is submitted, a <b>Complete</b> button appears in the course's Edit window. Completed courses go to your transcript.</li>
  </ul>

  <h3>Terms and dates</h3>
  <ul>
    <li>In the first year, both courses of each term are fixed. From the second year on, each term keeps one slot for a course you choose, so electives and seminars run alongside the fixed courses.</li>
    <li>Each term starts when the previous one ends, and ends when its courses end. Finish early and later terms move up; fall behind and they move back. Planned courses never start before today.</li>
    <li>The start date, the length of a term, terms per year, courses per term, and the number of courses and seminars required are in Settings › Schedule. The program file sets their initial values.</li>
  </ul>

  <h3>Colors</h3>
  <ul>
    <li>Gray outline: planned. Blue: in progress. Green: completed, submitted, or study logged.</li>
    <li>Yellow: needs attention (for example, a prerequisite not completed). Orange: due within 7 days. Red: overdue.</li>
  </ul>

  <h3>Calendar</h3>
  <p>A month view with due dates, notes, events, logged study, and the start and end of each term. Tap a date to see what is on it and to add a note or an event, with an optional time and course.</p>

  <h3>Transcript</h3>
  <p>Courses completed, fixed courses, electives, and seminars completed, nominal hours, the expected completion date, and every completed course with its dates and the links you recorded to your work.</p>

  <h3>Settings</h3>
  <ul>
    <li><b>Profile</b>: your name, a link (for example, your website), and a short text about you.</li>
    <li><b>Programs</b>: the published programs you have not started (the app tells you when a new one appears), your programs to switch or delete, loading a program from a file or a link, exporting the program in use (without your progress), and a CSV template to write your own.</li>
    <li><b>Program details</b> and <b>Schedule</b>: the program's name, description, and handbook; the start date, length of a term, terms per year, and courses per term; and the courses, electives, and seminars required, which can be raised but not set below the minimum.</li>
    <li><b>Verification page</b>: the app generates a web page file (.html) with your name, start and finish dates, and every course with the links you pasted. You create your diploma, publish it, and paste its public link here, together with a public link to the program's handbook. Then you download the file and publish it yourself, on any web host (GitHub Pages, for example). The app does not publish anything.</li>
    <li><b>Configuration and reminders</b>: save or load your configuration file, and export your due dates and events as an .ics file to import into any calendar app.</li>
    <li><b>Device</b>: light, dark, or system appearance; the app's version; and erasing all data on this device.</li>
  </ul>

  <h3>Your data</h3>
  <p>Everything you enter stays in this browser, on this device, and is never sent anywhere. The configuration file is your only backup and the way to move your data to another device: save it from time to time and keep it somewhere safe. Your own files, such as solutions and books, stay wherever you keep them; the app stores only links.</p>

  <h3>Updates</h3>
  <p>The installed app updates itself when a new version is published; your data stays the same.</p>
  </div>`;
  if(!d.open) d.showModal();
}

/* ---------- Verification page ---------- */
const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const ORD=["First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth"];
function buildVerificationPage(){
  const m=S.meta, pf=G.profile||{}, rs=reqStatus(), f=forecast(), sc=sched();
  const fmtL=s=>s?parse(s).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):"";
  const start=S.settings.courseStart;
  const finish=rs.complete ? chosenArr().map(c=>c.doneAt).filter(Boolean).sort().pop() : "";
  const years={}; for(const x of semsArr()) (years[x.year]=years[x.year]||[]).push(x);
  const box=c=>{ const w=sc.course[c.id]||{};
    const dates=c.status==="done"?`${fmtL(w.start)} – ${fmtL(c.doneAt)}`:c.status==="active"?`Started ${fmtL(w.start)}`:"Planned";
    const work=c.lists.map(l=>l.link?`<li><a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`:`<li class="na">${esc(l.label)}</li>`).join("");
    return `<details class="c"><summary>${esc(c.name)}</summary><div class="p">
      <p class="h"><b>${esc(ccode(c))} ${esc(c.name)}</b></p>
      <p class="m">${esc(KIND[c.kind]||"")} · ${num(c.hours,0)} hours · ${dates}</p>
      <ul>${work}</ul>
      ${c.refUrl?`<p class="m">Reference course: <a href="${esc(c.refUrl)}" target="_blank" rel="noopener">${esc(c.refLabel||c.refUrl)}</a></p>`:""}
    </div></details>`; };
  const grade=Object.entries(years).map(([y,list])=>{ const terms=list.map(x=>{ const cs=inSem(x.id).filter(c=>c.chosen!==false); return cs.length?`<h3>Term ${ROMAN[x.k-1]||x.k}</h3><div class="g">${cs.map(box).join("")}</div>`:""; }).join("");
    return terms?`<h2>${ORD[y-1]?ORD[y-1]+" Year":"Year "+y}</h2>${terms}`:""; }).join("");

/* ---------- Configuration file ---------- */
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
async function backup(){
  try{
    const states={}; for(const id of Object.keys(PROGS.list)) states[id]=id===S.id?S:await dbGet("kv",stateKey(id));
    const {dirty,lastExport,...glob}=G;
    download(new Blob([JSON.stringify({app:"self-taught-university",kind:"configuration",version:1,created:new Date().toISOString(),programs:PROGS,states,global:glob},null,1)],{type:"application/json"}),"self-taught-university-configuration.json");
    G.lastExport=new Date().toISOString(); G.dirty=false; await dbPut("kv",G,"global"); render(); renderSave();
    toast("Configuration saved. Keep the file somewhere safe.");
  }catch(e){ toast(e.message); }
}
async function restore(file){
  try{
    const data=JSON.parse(await file.text());
    if(data?.format===FORMAT) return toast("This file is a program without progress. Use \"Load file\" under Programs.");
    if(!data?.programs || !data?.states) throw new Error("the file does not contain an app configuration");
    if(!await ask("Loading the configuration replaces all programs, progress, calendar entries, and the profile on this device with those in the file. Continue?","Load")) return;
    for(const id of Object.keys(PROGS.list)) await dbDel("kv",stateKey(id));
    await dbClear("events");
    const progs=data.programs;
    for(const [id,st] of Object.entries(data.states)){ const m=normalize(st); m.id=id; await dbPut("kv",m,stateKey(id)); progs.list[id]={id,title:m.meta.title}; }
    PROGS=progs; G={profile:data.global?.profile||{}, lastExport:data.created||"", dirty:false};
    await dbPut("kv",PROGS,"programs"); await dbPut("kv",G,"global");
    await switchProgram(PROGS.active in PROGS.list ? PROGS.active : Object.keys(PROGS.list)[0]); toast("Configuration loaded.");
  }catch(e){ toast("Could not load: "+e.message); }
}

function exportICS(){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Self-Taught University//PT-BR","CALSCALE:GREGORIAN"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""); const q=t=>String(t).replace(/[,;\\]/g,m=>"\\"+m);
  let n=0;
  for(const c of coursesArr()) for(const l of c.lists){
    const due=dueOf(c,l); if(delivered(l)||!due||c.status==="done") continue; n++;
    L.push("BEGIN:VEVENT",`UID:${c.id}-${l.key}@self-taught-university`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${due.replace(/-/g,"")}`,`DTEND;VALUE=DATE:${addDays(due,1).replace(/-/g,"")}`,
      `SUMMARY:${q(`Due: ${cname(c)}, ${l.label}`)}`,`DESCRIPTION:${q(`Paste the link to your solutions in the app.`)}`,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Assignment due tomorrow","TRIGGER:-P1D","END:VALARM","END:VEVENT");
  }
  for(const it of Object.values(S.agenda)){
    if(it.kind!=="appt"||it.date<today()) continue; n++; const d=it.date.replace(/-/g,""); const c=it.courseId&&S.courses[it.courseId];
    let a,b,tr; if(it.time){ const [h,mi]=it.time.split(":").map(Number); a=`DTSTART:${d}T${pad(h)}${pad(mi)}00`; b=`DTEND:${h+1>=24?addDays(it.date,1).replace(/-/g,""):d}T${pad((h+1)%24)}${pad(mi)}00`; tr="TRIGGER:-PT30M"; }
    else { a=`DTSTART;VALUE=DATE:${d}`; b=`DTEND;VALUE=DATE:${addDays(it.date,1).replace(/-/g,"")}`; tr="TRIGGER:-P1D"; }
    L.push("BEGIN:VEVENT",`UID:${it.id}@self-taught-university`,`DTSTAMP:${stamp}`,a,b,`SUMMARY:${q(it.title+(c?` (${c.name})`:""))}`,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Event",tr,"END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  if(!n) return toast("No pending assignments or upcoming events with dates.");
  download(new Blob([L.join("\r\n")],{type:"text/calendar"}),`dates_${today()}.ics`); toast(`${n} events exported.`);
}

document.addEventListener("change", async e=>{

  if(ds.bf){ const [id,k]=ds.bf.split("|"); return dispatch("book.update",{id,patch:{[k]:el.value.trim()}}); }
  if(ds.set){ let v=Math.max(ds.set==="minSem"?0:1,num(el.value,1));
    const floor=ds.set==="minTotal"?STANDARD.courses:ds.set==="minSem"?STANDARD.seminars:ds.set==="minElet"?STANDARD.electives:0;
    if(v<floor){ v=floor; el.value=v; toast(`The minimum is ${floor}.`); } await dispatch("settings.set",{patch:{[ds.set]:v}},{quiet:true});
    if(ds.set==="perSemester"){ const r=reflow(S); if(Object.keys(r.assign).length){ await dispatch("plan.fill",r,{quiet:true}); toast(`Plan rearranged with ${v} courses per term.`); } }
    else if(ds.set==="semMonths"||ds.set==="perYear") toast("Dates and years recalculated.");
    return; }
  if(ds.profile!==undefined){ return dispatch("profile.set",{patch:{[ds.profile]:el.value.trim()}},{quiet:true}); }
  if(el.id==="progSel"){ return switchProgram(el.value); }
  if(ds.meta){ return dispatch("meta.update",{patch:{[ds.meta]:el.value.trim()}},{quiet:true}); }
  if(ds.setdate && el.value){ await dispatch("settings.set",{patch:{[ds.setdate]:el.value}},{quiet:true}); return toast("Dates recalculated."); }
});
document.addEventListener("toggle", e=>{ const el=e.target; if(el.dataset?.sec){ el.open?OPEN_SEC.add(el.dataset.sec):OPEN_SEC.delete(el.dataset.sec); } }, true);
$("#dlg").addEventListener("close",()=>{ OPEN_COURSE=null; EDIT_BOOK=null; render(); });

/* ---------- Startup ---------- */
(async function init(){
  try{
    DB=await openDB();
    DEVICE=await dbGet("kv","device"); if(!DEVICE){ DEVICE=uid(); await dbPut("kv",DEVICE,"device"); }
    G=await dbGet("kv","global")||{profile:{}}; G.profile=G.profile||{};
    PROGS=await dbGet("kv","programs");
    if(!PROGS){ PROGS={active:"",list:{}}; await dbPut("kv",PROGS,"programs"); await dbPut("kv",G,"global"); }
    const st=PROGS.active?await dbGet("kv",stateKey(PROGS.active)):null;
    if(st){ S=normalize(st); S.id=PROGS.active; } else S=null;
    if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){
    S=null; PROGS={active:"",list:{}}; DEVICE="local-only";
    setTimeout(()=>toast("This browser does not allow local storage; changes are lost when you close it."),500);
  }
  applyTheme(getTheme()); try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme(getTheme())); }catch(e){}
  renderSave(); render();
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
    const had=!!navigator.serviceWorker.controller; let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had && !reloaded){ reloaded=true; location.reload(); } });
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  }
})();
</script>
